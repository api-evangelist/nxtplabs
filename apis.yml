name: NXTP
description: >-
  NXTP is an early-stage B2B technology venture capital firm investing across
  Latin America and globally, with more than 15 years of investing experience.
  Originally added to the API Evangelist network as "NXTPLabs" — a portfolio lead
  of 500 Global — enrichment revealed nxtplabs.com now redirects to nxtp.vc, the
  firm's current home. NXTP runs Fund III ($100M), has made 122 investments with
  32 exits, and its portfolio companies have raised more than $2.3B in capital.
  The firm backs category-defining B2B founders from offices in Buenos Aires,
  São Paulo, and Mexico City. As an investment firm it publishes no public API,
  developer platform, SDK, or technical documentation, so this profile carries
  identity and firm facts rather than API artifacts.
